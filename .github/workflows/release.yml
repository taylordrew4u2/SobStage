name: Release

# Produces downloadable builds for all three platforms. Runs on a version tag,
# and on demand so a build can be had without cutting a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Optional: publish a GitHub Release under this tag (e.g. v0.1.0).
          The tag is created at the built commit by the workflow itself --
          this environment's git proxy only permits branch pushes, so tagging
          has to happen here. Leave empty for build-only artifacts.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_identity.outputs.version }}
      release_tag: ${{ steps.release_identity.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Match the release tag to the application version
        id: release_identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^project\(SobStage VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)"
          test -n "$version" \
            || { echo "::error::Could not read the SobStage version from CMakeLists.txt"; exit 1; }

          expected_tag="v${version}"
          release_tag=""
          if [[ "$EVENT_NAME" == "push" ]]; then
            release_tag="$PUSHED_TAG"
          elif [[ -n "$REQUESTED_RELEASE_TAG" ]]; then
            release_tag="$REQUESTED_RELEASE_TAG"
          fi

          if [[ -n "$release_tag" && "$release_tag" != "$expected_tag" ]]; then
            echo "::error::Release tag '$release_tag' does not match project version '$expected_tag'"
            exit 1
          fi

          # A public artifact may only be cut from the exact tip of main. This
          # rejects both a dispatch from another branch and a tag placed on an
          # older/off-main commit, so the published source and the branch the
          # owner asked us to keep authoritative can never diverge.
          if [[ -n "$release_tag" ]]; then
            git fetch --no-tags --depth=1 origin \
              +refs/heads/main:refs/remotes/origin/main
            candidate_sha="$(git rev-parse HEAD)"
            main_sha="$(git rev-parse refs/remotes/origin/main)"
            if [[ "$candidate_sha" != "$main_sha" ]]; then
              echo "::error::Public releases must run from the exact tip of main ($main_sha), not $candidate_sha."
              exit 1
            fi

            # A dispatch may name a tag that already exists even when no
            # GitHub Release exists yet. In that case target_commitish is
            # ignored by GitHub, so verify the tag itself cannot make the
            # automatic source archives point at different code.
            if git ls-remote --exit-code --tags origin \
                 "refs/tags/$release_tag" >/dev/null 2>&1; then
              git fetch --no-tags origin \
                "refs/tags/$release_tag:refs/tags/$release_tag"
              tagged_sha="$(git rev-list -n 1 "$release_tag")"
              if [[ "$tagged_sha" != "$candidate_sha" ]]; then
                echo "::error::Existing tag $release_tag points to $tagged_sha, not candidate $candidate_sha."
                exit 1
              fi
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          if [[ -n "$release_tag" ]]; then
            echo "Validated release $release_tag"
          else
            echo "Validated build-only run for SobStage $version"
          fi

  build:
    name: ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 for the same reason as CI: JUCE 7.0.12 calls
          # CGWindowListCreateImage, which the macOS 15+ SDK marks unavailable.
          - os: macos-14
            label: macOS
            artifact: SobStage-macOS
          - os: windows-latest
            label: Windows
            artifact: SobStage-Windows
          - os: ubuntu-latest
            label: Linux
            artifact: SobStage-Linux

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            alsa-utils xvfb xdotool imagemagick

      - name: Cache JUCE
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/_deps
          # Release's macOS cache contains universal arm64+x86_64 generated
          # state, unlike CI's native-only tree. Keep the workflows namespaced
          # so an immutable shared cache cannot cross-contaminate them.
          key: release-juce-4f43011b96eb0636104cb3e433894cda98243626-${{ hashFiles('ThirdParty/Patches/juce-7.0.12-camera-lifecycle.patch') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Configure macOS universal build
        if: runner.os == 'macOS'
        run: >-
          cmake -B build -DMMA_BUILD_APP=ON -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -B build -DMMA_BUILD_APP=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      # The unit tests gate the release: a build that cannot pass them is not
      # worth handing to anyone.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # A public release must carry its own evidence instead of assuming the
      # separate branch CI run has already finished. Keep test-only ALSA input
      # support in an isolated build tree so it can never leak into out/.
      - name: Live capture through the real Linux audio API
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -B build-live -DCMAKE_BUILD_TYPE=Release -DMMA_ALLOW_TEST_INPUTS=ON
          cmake --build build-live --config Release --target live_capture -j 4
          ./Tools/setup_alsa_fixture.sh
          ./build-live/live_capture "${RUNNER_TEMP}/live"

      # These are duplicated deliberately from CI: release publication is a
      # separate workflow and must fail on memory, undefined-behaviour, or data
      # race findings even if branch CI is still pending or has failed.
      - name: Simulated audio backends under release sanitizers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake --build build-asan --target sim_coreaudio sim_wasapi -j 4
          ./build-asan/sim_coreaudio
          ./build-asan/sim_wasapi

          cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-fsanitize=thread"
          cmake --build build-tsan --target sim_coreaudio sim_wasapi -j 4
          ./build-tsan/sim_coreaudio
          ./build-tsan/sim_wasapi

      # The production Linux build rejects virtual inputs. Build a separate,
      # compile-time test binary for the file-backed ALSA fixture; never put this
      # opt-in binary in out/ or any downloadable artifact.
      - name: Build the Linux end-to-end test application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -B build-app \
            -DMMA_BUILD_APP=ON \
            -DMMA_ALLOW_TEST_INPUTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            "-DFETCHCONTENT_SOURCE_DIR_JUCE=${GITHUB_WORKSPACE}/build/_deps/juce-src"
          cmake --build build-app --config Release --target SobStage fs_stall_shim alsa_readi_shim -j 4

      - name: End-to-end recording gates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          # Both legacy E2E scripts discover their app from known build paths.
          # Hide the production binary for this step so they deterministically
          # exercise build-app, then restore it before install packages build/.
          shipping_app="build/SobStage_artefacts/Release/SobStage"
          test_app="build-app/SobStage_artefacts/Release/SobStage"
          test -x "$shipping_app"
          test -x "$test_app"
          held_app="${shipping_app}.release-gate-hold"
          mv "$shipping_app" "$held_app"
          restore_shipping_app() {
            mv "$held_app" "$shipping_app"
          }
          trap restore_shipping_app EXIT

          bash Tools/e2e_app_take.sh 15
          bash Tools/e2e_refusal.sh
          # A card that stops answering at Record and at Stop: the window must
          # keep answering and nothing may be called saved.
          bash Tools/e2e_card_stall.sh
          # Microphones on independent real-time clocks: the drift loop and
          # the drift measurement against known crystals, in the real app.
          bash Tools/e2e_realtime_mics.sh 75

          restore_shipping_app
          trap - EXIT

      # The install tree IS the deliverable, so packaging exercises the same
      # install() rules a local `cmake --install` uses rather than a second,
      # parallel copy step that could drift away from them.
      - name: Install
        run: cmake --install build --prefix out --config Release

      - name: Prove the Windows ZIP needs no Visual C++ redistributable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw 'vswhere.exe was not found on the Windows runner.'
          }

          $visualStudio = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $dumpbin = Get-ChildItem "$visualStudio\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $dumpbin) {
            throw 'dumpbin.exe was not found on the Windows runner.'
          }

          $imports = (& $dumpbin.FullName /dependents out/bin/SobStage.exe 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed with exit code $LASTEXITCODE.`n$imports"
          }
          if ($imports -match '(?im)^\s*(MSVCP|VCRUNTIME)[^\s]*\.dll\s*$') {
            throw "The portable executable still depends on an unbundled Visual C++ runtime DLL.`n$imports"
          }
          Write-Host 'No MSVCP/VCRUNTIME imports: the portable Windows binary carries its MSVC runtime.'

      # Signed with Authenticode when the repository carries a certificate.
      # Without one the executable ships unsigned, as every release before
      # v1.12.0 did, and the workflow log says so. Half a pair of secrets is
      # still a configuration error and fails.
      - name: Authenticode-sign the Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $haveCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX)
          $havePassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)

          if ($haveCertificate -ne $havePassword) {
            throw 'Windows signing secrets are incomplete. Set both WINDOWS_CERTIFICATE_PFX and WINDOWS_CERTIFICATE_PASSWORD.'
          }

          if (-not $haveCertificate) {
            'SOBSTAGE_WINDOWS_SIGNING=unsigned' | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Warning 'Unsigned Windows build: no WINDOWS_CERTIFICATE_PFX secret. SmartScreen will show "unknown publisher" until one is added.'
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP 'sobstage-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))

          try {
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if ($null -eq $signTool) {
              throw 'signtool.exe was not found on the Windows runner.'
            }

            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD out/bin/SobStage.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }

            & $signTool.FullName verify /pa /all /v out/bin/SobStage.exe
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed with exit code $LASTEXITCODE" }

            $signature = Get-AuthenticodeSignature out/bin/SobStage.exe
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode status is $($signature.Status), expected Valid."
            }

            'SOBSTAGE_WINDOWS_SIGNING=authenticode' | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Check the artifact is not empty
        shell: bash
        run: |
          set -euo pipefail
          ls -R out
          test -n "$(find out -type f)"
          for document in README.md LICENSE LICENSING.md SUPPORT.md PRIVACY.md RELEASE_CHECKLIST.md; do
            test -f "out/$document" \
              || { echo "::error::$document missing from install tree"; exit 1; }
          done
          case "${{ runner.os }}" in
            macOS)
              test -d out/SobStage.app \
                || { echo "::error::macOS app missing from install tree"; exit 1; }
              ;;
            Windows)
              test -f out/bin/SobStage.exe \
                || { echo "::error::Windows executable missing from install tree"; exit 1; }
              ;;
            Linux)
              test -x out/bin/SobStage \
                || { echo "::error::Linux executable missing or not executable"; exit 1; }
              ;;
          esac

      # Package on Windows, extract the exact ZIP, re-check its signature when
      # present, and launch that round-tripped executable. This is the supported
      # Windows distribution format; a source-tree binary is not release proof.
      - name: Package and smoke-test the Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stagingRoot = Join-Path $env:RUNNER_TEMP 'windows-zip'
          $staging = Join-Path $stagingRoot 'SobStage-Windows'
          $verify = Join-Path $env:RUNNER_TEMP 'windows-zip-verify'
          Remove-Item $stagingRoot, $verify -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $staging, $verify | Out-Null
          Copy-Item out/* $staging -Recurse -Force
          Compress-Archive -Path $staging -DestinationPath SobStage-Windows.zip -CompressionLevel Optimal
          Expand-Archive SobStage-Windows.zip -DestinationPath $verify

          $exe = Join-Path $verify 'SobStage-Windows/bin/SobStage.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'Windows ZIP is missing SobStage.exe.'
          }

          if ($env:SOBSTAGE_WINDOWS_SIGNING -eq 'authenticode') {
            $signature = Get-AuthenticodeSignature $exe
            if ($signature.Status -ne 'Valid') {
              throw "Round-tripped Authenticode status is $($signature.Status), expected Valid."
            }
          }

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          try {
            if ($process.HasExited) {
              throw "The packaged Windows application exited during its clean-runner smoke test with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      # Create the Linux container before artifact transport. Uploading the
      # install tree as loose files normalizes its Unix modes; zipping it later
      # on another runner therefore produced a download whose app needed a
      # manual chmod. The native ZIP is opaque in every later job.
      - name: Package and verify the Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          staging="${RUNNER_TEMP}/linux-zip/SobStage-Linux"
          verify="${RUNNER_TEMP}/linux-zip-verify"
          rm -rf "${RUNNER_TEMP}/linux-zip" "$verify"
          mkdir -p "$staging" "$verify"
          cp -a out/. "$staging/"
          (cd "${RUNNER_TEMP}/linux-zip" && zip -r -9 "${GITHUB_WORKSPACE}/SobStage-Linux.zip" SobStage-Linux)

          unzip -q SobStage-Linux.zip -d "$verify"
          test -x "$verify/SobStage-Linux/bin/SobStage" \
            || { echo "::error::Linux ZIP lost its executable permission"; exit 1; }
          for document in README.md LICENSE LICENSING.md SUPPORT.md PRIVACY.md RELEASE_CHECKLIST.md; do
            test -f "$verify/SobStage-Linux/$document" \
              || { echo "::error::$document missing from Linux ZIP"; exit 1; }
          done

          # Launch the round-tripped production binary in a clean virtual
          # desktop. A healthy GUI keeps running until timeout asks it to stop;
          # an earlier exit is a packaging/runtime failure.
          set +e
          timeout 8s xvfb-run -a "$verify/SobStage-Linux/bin/SobStage" \
            >"${RUNNER_TEMP}/sobstage-smoke.log" 2>&1
          smoke_status=$?
          set -e
          if [[ "$smoke_status" -ne 124 ]]; then
            cat "${RUNNER_TEMP}/sobstage-smoke.log"
            echo "::error::The packaged Linux application exited during its clean-runner smoke test ($smoke_status)."
            exit 1
          fi

      # Create both macOS containers on macOS. In particular, the .app must be
      # placed into its .zip by ditto before Actions transports it; uploading an
      # unpacked bundle and re-zipping it on Linux drops its executable bit.
      - name: Verify and package the macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          version="${{ needs.prepare.outputs.version }}"
          app="$(find out -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          appname="$(basename "$app")"

          signing_values=(
            "$APPLE_CERTIFICATE_P12"
            "$APPLE_CERTIFICATE_PASSWORD"
            "$APPLE_ID"
            "$APPLE_APP_PASSWORD"
            "$APPLE_TEAM_ID"
          )
          signing_value_count=0
          for value in "${signing_values[@]}"; do
            [[ -n "$value" ]] && signing_value_count=$((signing_value_count + 1))
          done

          if (( signing_value_count != 0 && signing_value_count != ${#signing_values[@]} )); then
            echo "::error::Apple signing secrets are incomplete. Set APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_APP_PASSWORD and APPLE_TEAM_ID together."
            exit 1
          fi

          production_signing=false
          signing_keychain=""
          cleanup_signing() {
            if [[ -n "$signing_keychain" ]]; then
              security delete-keychain "$signing_keychain" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_signing EXIT

          if (( signing_value_count == ${#signing_values[@]} )); then
            production_signing=true
            signing_keychain="${RUNNER_TEMP}/sobstage-signing.keychain-db"
            signing_keychain_password="$(openssl rand -hex 24)"
            certificate_path="${RUNNER_TEMP}/sobstage-signing.p12"
            printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$certificate_path"

            security create-keychain -p "$signing_keychain_password" "$signing_keychain"
            security set-keychain-settings -lut 21600 "$signing_keychain"
            security unlock-keychain -p "$signing_keychain_password" "$signing_keychain"
            security import "$certificate_path" -k "$signing_keychain" \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$certificate_path"
            security set-key-partition-list -S apple-tool:,apple: -s \
              -k "$signing_keychain_password" "$signing_keychain"
            security list-keychains -d user -s "$signing_keychain"

            signing_identity="$(security find-identity -v -p codesigning "$signing_keychain" \
              | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)"
            if [[ -z "$signing_identity" ]]; then
              echo "::error::The imported certificate does not contain a Developer ID Application identity."
              exit 1
            fi

            codesign --force --options runtime --timestamp \
              --entitlements Resources/SobStage.entitlements \
              --sign "$signing_identity" "$app"
            codesign --verify --deep --strict --verbose=2 "$app"

            # Notarize the signed bundle first, then staple the ticket before
            # either public container is created. The ZIP therefore carries a
            # stapled app even on a machine that is offline when it is opened.
            notary_zip="${RUNNER_TEMP}/SobStage-notary.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$notary_zip"
            xcrun notarytool submit "$notary_zip" --wait \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
            echo "SOBSTAGE_MAC_SIGNING=developer-id-notarized" >> "$GITHUB_ENV"
          else
            # No Developer ID credentials in the repository: ship ad-hoc signed,
            # as every release before v1.12.0 did. The README's macOS install
            # step tells the user to clear quarantine once.
            #
            # Ad-hoc re-sign, and the reason this fallback exists at all.
            #
            # The linker ad-hoc signs every arm64 binary, because Apple Silicon
            # refuses to execute one that carries no signature. But CMake's
            # install(DIRECTORY) copies the bundle as ordinary files and does not
            # preserve that signature, so what lands in out/ has a broken one.
            # Gatekeeper reports a broken signature as "is damaged and can't be
            # opened" -- a message that sounds like a corrupt download and sends
            # people off re-downloading a file that was never the problem. And
            # unlike an unsigned-but-intact app, Control-click -> Open does not get
            # past it. So re-sign here, after the install, where it sticks.
            codesign --force --options runtime --timestamp=none \
              --entitlements Resources/SobStage.entitlements --sign - "$app"
            echo "SOBSTAGE_MAC_SIGNING=adhoc" >> "$GITHUB_ENV"
            echo "::warning::Ad-hoc macOS build: no Developer ID secrets. Users must clear quarantine once (see README, Installing -> macOS)."
          fi
          bash Tools/verify_macos_release.sh \
            "$app" "$version" 13.0 --capture-entitlements

          zip_staging="${RUNNER_TEMP}/zip/SobStage-macOS"
          rm -rf "${RUNNER_TEMP}/zip"
          mkdir -p "$zip_staging"
          ditto "$app" "$zip_staging/$appname"
          cp out/README.md out/LICENSE out/LICENSING.md \
            out/SUPPORT.md out/PRIVACY.md out/RELEASE_CHECKLIST.md \
            "$zip_staging/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$zip_staging" "SobStage-macOS.zip"

          # Extract and inspect the final ZIP, not its source directory. This is
          # the regression check for the previously non-executable download.
          zip_verify="${RUNNER_TEMP}/zip-verify"
          rm -rf "$zip_verify"
          mkdir -p "$zip_verify"
          ditto -x -k "SobStage-macOS.zip" "$zip_verify"
          bash Tools/verify_macos_release.sh \
            "$zip_verify/SobStage-macOS/$appname" "$version" 13.0 \
            --capture-entitlements
          for document in README.md LICENSE LICENSING.md SUPPORT.md PRIVACY.md RELEASE_CHECKLIST.md; do
            test -f "$zip_verify/SobStage-macOS/$document" \
              || { echo "::error::$document missing from macOS ZIP"; exit 1; }
          done

          # Launch the app extracted from the exact ZIP on this clean runner.
          # It should remain alive until asked to quit; an immediate exit means
          # the package passed static inspection but is not usable.
          zip_app="$zip_verify/SobStage-macOS/$appname"
          "$zip_app/Contents/MacOS/SobStage" >"${RUNNER_TEMP}/sobstage-smoke.log" 2>&1 &
          smoke_pid=$!
          sleep 5
          if ! kill -0 "$smoke_pid" 2>/dev/null; then
            wait "$smoke_pid" || smoke_status=$?
            cat "${RUNNER_TEMP}/sobstage-smoke.log"
            echo "::error::The packaged macOS application exited during its clean-runner smoke test (${smoke_status:-unknown})."
            exit 1
          fi
          kill "$smoke_pid"
          wait "$smoke_pid" || true

          staging="${RUNNER_TEMP}/dmg/SobStage"
          rm -rf "${RUNNER_TEMP}/dmg"
          mkdir -p "$staging/.background"

          # ditto, not cp -R. Only ditto preserves bundle structure, extended
          # attributes and the signature; cp -R is what broke the signature the
          # first time this shipped.
          ditto "$app" "$staging/$appname"
          # README.md and LICENSE beside the app, the other four documents in
          # one "More documents" folder. Six loose documents do not fit under
          # the instructions drawn on the background.
          python3 Tools/dmg_layout.py stage-documents out "$staging"
          cp Resources/DmgBackground.png "$staging/.background/background.png"
          ln -s /Applications "$staging/Applications"

          # Every visible item needs a place in the window. v1.13.25 staged six
          # documents and placed three; Finder put the other three wherever it
          # liked, two of them on the xattr command the background exists to
          # show. Tools/dmg_layout.py holds the one list of places, and an
          # item missing from it stops the build here.
          python3 Tools/dmg_layout.py check-staging "$staging" --app "$appname"

          # Build read-write first: the window layout below is Finder state
          # stored in the volume, so it has to be written before the image is
          # compressed into its final read-only form.
          # -size gives the volume slack. Sized exactly to its content, there
          # is no room for Finder to write the .DS_Store that *holds* the layout,
          # and the layout silently does not stick.
          rw="${RUNNER_TEMP}/rw.dmg"
          hdiutil create -volname "SobStage" -srcfolder "$staging" \
            -ov -format UDRW -fs HFS+ -size 250m "$rw"

          # Mount at the default /Volumes location, and WITHOUT -nobrowse.
          # Finder only knows about disks it has been told to browse and that
          # live under /Volumes: a custom mountpoint plus -nobrowse is invisible
          # to it, which is exactly why the first attempt at this failed with
          # `Finder got an error: Can't get disk "SobStage" (-1728)`
          # and shipped a plain window.
          mountpoint="/Volumes/SobStage"
          hdiutil attach "$rw"

          # Lay the window out so opening the image *is* the instructions: the
          # app on the left, Applications on the right, and the background art
          # carrying the arrow and the first-launch step between them. The
          # window size, icon size and every position come from
          # Tools/dmg_layout.py, the same table both checks use.
          #
          # A script file rather than a heredoc: a heredoc terminator has to sit
          # at column 0, which would end this YAML block scalar early.
          layout_script="${RUNNER_TEMP}/dmg-layout.applescript"
          python3 Tools/dmg_layout.py applescript --app "$appname" > "$layout_script"
          osascript "$layout_script" \
            || echo "::warning::Finder layout failed; shipping a plain image instead"

          # Deliberately non-fatal. The window layout is presentation; the image
          # is the deliverable. Finder scripting depends on a GUI session being
          # available on the runner, and losing the arrow is not a reason to
          # ship no build at all.

          sync
          hdiutil detach "$mountpoint"

          hdiutil convert "$rw" -format UDZO -imagekey zlib-level=9 \
            -o "SobStage-macOS.dmg" -ov

          if [[ "$production_signing" == true ]]; then
            # The app inside is already signed and stapled. The DMG is a
            # separate executable-code container and needs its own Developer
            # ID signature before Apple notarizes it.
            codesign --force --timestamp --sign "$signing_identity" \
              --identifier com.taylordrew.sobstage.dmg "SobStage-macOS.dmg"
            codesign --verify --strict --verbose=2 "SobStage-macOS.dmg"
            xcrun notarytool submit "SobStage-macOS.dmg" --wait \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            xcrun stapler staple "SobStage-macOS.dmg"
            xcrun stapler validate "SobStage-macOS.dmg"
            spctl --assess --type open --context context:primary-signature \
              --verbose=2 "SobStage-macOS.dmg"
          fi

          hdiutil verify "SobStage-macOS.dmg"

          # Prove the signature survived the image round-trip, rather than
          # assuming it did. This is the check that would have caught the
          # "damaged" failure before anyone downloaded it.
          verify="${RUNNER_TEMP}/dmg-verify"
          rm -rf "$verify"; mkdir -p "$verify"
          hdiutil attach "SobStage-macOS.dmg" \
            -mountpoint "$verify" -nobrowse -readonly
          bash Tools/verify_macos_release.sh \
            "$verify/$appname" "$version" 13.0 --capture-entitlements
          if [[ "$production_signing" == true ]]; then
            xcrun stapler validate "$verify/$appname"
            spctl --assess --type execute --verbose=2 "$verify/$appname"
          fi
          test -f "$verify/.background/background.png"
          test -L "$verify/Applications" \
            || { echo "::error::Applications link missing from macOS disk image"; exit 1; }
          [[ "$(readlink "$verify/Applications")" == "/Applications" ]] \
            || { echo "::error::Applications link has the wrong target"; exit 1; }

          # Read the window back from the finished image, not from the script
          # that was meant to make it: every document is in its place, every
          # visible icon has a saved position, and none of them covers the
          # instructions on the background. An icon on the xattr command fails
          # the build. A plain window (Finder had no GUI to lay it out) has
          # nothing drawn behind its icons, so that stays a warning.
          python3 Tools/dmg_layout.py check-image "$verify" --app "$appname"

          # Report what is actually true. The previous version printed
          # "window layout verified" unconditionally, while only checking that
          # the background *file* was present -- so it said the layout was
          # verified on a build where Finder had failed and the layout was not
          # there at all. The layout lives in .DS_Store; its presence is the
          # only evidence the window was actually arranged.
          if [ -f "$verify/.DS_Store" ]; then
            echo "Signature verified; window layout present in the image and checked."
          else
            echo "::warning::Signature verified, but no window layout -- plain image"
          fi

          hdiutil detach "$verify"
          cleanup_signing
          trap - EXIT

      - name: Upload the Windows ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SobStage-Windows-zip
          path: SobStage-Windows.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload the Linux ZIP
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SobStage-Linux-zip
          path: SobStage-Linux.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload the macOS ZIP
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SobStage-macOS-zip
          path: SobStage-macOS.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload the disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SobStage-macOS-dmg
          path: SobStage-macOS.dmg
          if-no-files-found: error
          compression-level: 0

  # Download the opaque containers onto a second clean runner of the matching
  # OS and launch what came back from Actions. This catches transport damage,
  # missing runtime libraries and package-only startup failures that a launch
  # beside the compiler cannot see.
  smoke:
    name: Downloaded artifact (${{ matrix.label }})
    needs: [prepare, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download macOS ZIP
        if: runner.os == 'macOS'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SobStage-macOS-zip
          path: downloaded

      - name: Download macOS DMG
        if: runner.os == 'macOS'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SobStage-macOS-dmg
          path: downloaded

      - name: Download Windows ZIP
        if: runner.os == 'Windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SobStage-Windows-zip
          path: downloaded

      - name: Download Linux ZIP
        if: runner.os == 'Linux'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SobStage-Linux-zip
          path: downloaded

      - name: Verify and launch downloaded macOS containers
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Only whether it is set is read here: the build job notarizes when
          # this secret exists and ships ad-hoc when it does not.
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          extracted="${RUNNER_TEMP}/downloaded-mac-zip"
          mounted="${RUNNER_TEMP}/downloaded-mac-dmg"
          mkdir -p "$extracted" "$mounted"
          ditto -x -k downloaded/SobStage-macOS.zip "$extracted"
          zip_app="$(find "$extracted" -maxdepth 3 -name SobStage.app -print -quit)"
          test -n "$zip_app"
          bash Tools/verify_macos_release.sh \
            "$zip_app" "$version" 13.0 --capture-entitlements

          hdiutil verify downloaded/SobStage-macOS.dmg
          hdiutil attach downloaded/SobStage-macOS.dmg \
            -mountpoint "$mounted" -nobrowse -readonly
          cleanup_mount() { hdiutil detach "$mounted" >/dev/null 2>&1 || true; }
          trap cleanup_mount EXIT
          dmg_app="$mounted/SobStage.app"
          bash Tools/verify_macos_release.sh \
            "$dmg_app" "$version" 13.0 --capture-entitlements

          if [[ -n "$APPLE_CERTIFICATE_P12" ]]; then
            xcrun stapler validate downloaded/SobStage-macOS.dmg
            spctl --assess --type open --context context:primary-signature \
              --verbose=2 downloaded/SobStage-macOS.dmg
            for app in "$zip_app" "$dmg_app"; do
              xcrun stapler validate "$app"
              spctl --assess --type execute --verbose=2 "$app"
            done
          fi

          for app in "$zip_app" "$dmg_app"; do
            "$app/Contents/MacOS/SobStage" \
              >"${RUNNER_TEMP}/$(basename "$(dirname "$app")")-smoke.log" 2>&1 &
            pid=$!
            sleep 5
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || status=$?
              echo "::error::Downloaded macOS app exited during smoke test (${status:-unknown})."
              exit 1
            fi
            kill "$pid"
            wait "$pid" || true
          done

          cleanup_mount
          trap - EXIT

      - name: Verify and launch downloaded Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Only whether it is set is read here: the build job signs when this
          # secret exists and ships unsigned when it does not.
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extracted = Join-Path $env:RUNNER_TEMP 'downloaded-windows'
          Expand-Archive downloaded/SobStage-Windows.zip -DestinationPath $extracted
          $exe = Join-Path $extracted 'SobStage-Windows/bin/SobStage.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'The downloaded Windows ZIP is missing SobStage.exe.'
          }

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX)) {
            $signature = Get-AuthenticodeSignature $exe
            if ($signature.Status -ne 'Valid') {
              throw "Downloaded Authenticode status is $($signature.Status), expected Valid."
            }
          }

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          try {
            if ($process.HasExited) {
              throw "The downloaded Windows app exited during smoke test with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Verify and launch downloaded Linux ZIP
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          extracted="${RUNNER_TEMP}/downloaded-linux"
          mkdir -p "$extracted"
          unzip -q downloaded/SobStage-Linux.zip -d "$extracted"
          app="$extracted/SobStage-Linux/bin/SobStage"
          test -x "$app"

          set +e
          timeout 8s xvfb-run -a "$app" >"${RUNNER_TEMP}/sobstage-smoke.log" 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 124 ]]; then
            cat "${RUNNER_TEMP}/sobstage-smoke.log"
            echo "::error::Downloaded Linux app exited during smoke test ($status)."
            exit 1
          fi

  package:
    name: Assemble release candidate
    needs: [prepare, build, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact SobStage source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out the exact JUCE corresponding source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: juce-framework/JUCE
          ref: 4f43011b96eb0636104cb3e433894cda98243626
          path: corresponding-source/JUCE
          fetch-depth: 1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: artifacts }

      - name: Assemble release assets and checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir release-assets

          # Ship complete, offline-buildable corresponding source beside the
          # binaries. The normal GitHub-generated archive contains SobStage but
          # not the JUCE code fetched while compiling; this bundle contains the
          # exact revisions of both and CMake automatically consumes its
          # ThirdParty/JUCE tree.
          version="${{ needs.prepare.outputs.version }}"
          source_name="SobStage-${version}-source"
          source_root="source-staging/${source_name}"
          mkdir -p "$source_root/ThirdParty/JUCE"
          git archive HEAD | tar -xf - -C "$source_root"
          juce_sha="$(git -C corresponding-source/JUCE rev-parse HEAD)"
          [[ "$juce_sha" == "4f43011b96eb0636104cb3e433894cda98243626" ]] \
            || { echo "::error::Wrong JUCE source revision: $juce_sha"; exit 1; }
          git -C corresponding-source/JUCE archive HEAD \
            | tar -xf - -C "$source_root/ThirdParty/JUCE"
          printf 'SobStage commit: %s\nJUCE commit: %s\n' \
            "$(git rev-parse HEAD)" "$juce_sha" > "$source_root/SOURCE_REVISIONS.txt"
          (cd source-staging && zip -qr "../release-assets/${source_name}.zip" "$source_name")

          cd artifacts
          shopt -s nullglob
          for d in */; do
            name="${d%/}"
            packaged=("$d"/*.zip "$d"/*.dmg)

            # Native containers were already verified on their build runners.
            # Copy them as opaque files so this Linux job cannot alter bundle
            # metadata or executable permissions inside.
            if (( ${#packaged[@]} > 0 )); then
              cp "${packaged[@]}" ../release-assets/
              continue
            fi

            zip -r "../release-assets/$name.zip" "$d"
          done

          cd ../release-assets
          test -f SobStage-Linux.zip
          test -f SobStage-macOS.dmg
          test -f SobStage-macOS.zip
          test -f SobStage-Windows.zip
          test -f "SobStage-${version}-source.zip"
          assets=(*.zip *.dmg)
          (( ${#assets[@]} == 5 )) \
            || { echo "::error::Expected four binaries plus source, found ${#assets[@]} assets"; exit 1; }
          sha256sum \
            SobStage-Linux.zip \
            SobStage-macOS.dmg \
            SobStage-macOS.zip \
            SobStage-Windows.zip \
            "SobStage-${version}-source.zip" > SHA256SUMS
          sha256sum --check SHA256SUMS

          source_verify="$(mktemp -d)"
          unzip -q "SobStage-${version}-source.zip" -d "$source_verify"
          test -f "$source_verify/SobStage-${version}-source/CMakeLists.txt"
          test -f "$source_verify/SobStage-${version}-source/ThirdParty/JUCE/CMakeLists.txt"
          test -f "$source_verify/SobStage-${version}-source/ThirdParty/JUCE/LICENSE.md"
          test -f "$source_verify/SobStage-${version}-source/ThirdParty/Patches/juce-7.0.12-camera-lifecycle.patch"
          test -f "$source_verify/SobStage-${version}-source/cmake/ApplyJucePatches.cmake"
          test -f "$source_verify/SobStage-${version}-source/SOURCE_REVISIONS.txt"

          # Exercise the patch from the extracted corresponding-source bundle,
          # rather than checking only that the files have familiar names. This
          # proves the shipped raw JUCE tree accepts the patch, the helper is
          # idempotent, and the resulting source matches the reverse diff.
          source_tree="$source_verify/SobStage-${version}-source"
          patch_probe="${RUNNER_TEMP}/verify-source-camera-patch.cmake"
          printf 'include("%s")\nsobstage_apply_juce_camera_patch("%s")\nsobstage_apply_juce_camera_patch("%s")\n' \
            "$source_tree/cmake/ApplyJucePatches.cmake" \
            "$source_tree/ThirdParty/JUCE" \
            "$source_tree/ThirdParty/JUCE" > "$patch_probe"
          cmake -P "$patch_probe"
          git -C "$source_tree/ThirdParty/JUCE" apply --reverse --check \
            --ignore-whitespace --whitespace=nowarn \
            "$source_tree/ThirdParty/Patches/juce-7.0.12-camera-lifecycle.patch"

          # Prove the macOS ZIP retained its executable mode through the
          # Actions upload/download boundary before this exact file is promoted.
          zip_verify="$(mktemp -d)"
          unzip -q SobStage-macOS.zip -d "$zip_verify"
          mac_executable="$(find "$zip_verify" -path '*/SobStage.app/Contents/MacOS/SobStage' -print -quit)"
          test -n "$mac_executable"
          test -x "$mac_executable" \
            || { echo "::error::macOS ZIP lost its executable permission"; exit 1; }

          linux_verify="$(mktemp -d)"
          unzip -q SobStage-Linux.zip -d "$linux_verify"
          test -x "$linux_verify/SobStage-Linux/bin/SobStage" \
            || { echo "::error::Linux ZIP lost its executable permission"; exit 1; }

          windows_verify="$(mktemp -d)"
          unzip -q SobStage-Windows.zip -d "$windows_verify"
          test -f "$windows_verify/SobStage-Windows/bin/SobStage.exe" \
            || { echo "::error::Windows ZIP is missing SobStage.exe"; exit 1; }

          for document in README.md LICENSE LICENSING.md SUPPORT.md PRIVACY.md RELEASE_CHECKLIST.md; do
            test -f "$linux_verify/SobStage-Linux/$document" \
              || { echo "::error::$document missing from final Linux ZIP"; exit 1; }
            test -f "$windows_verify/SobStage-Windows/$document" \
              || { echo "::error::$document missing from final Windows ZIP"; exit 1; }
          done

      - name: Upload the complete release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SobStage-release-candidate
          path: release-assets/
          if-no-files-found: error
          compression-level: 0

  release:
    name: Attach to release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.release_tag != ''
    env:
      # This job intentionally does not check out the repository, so make the
      # gh CLI target explicit instead of relying on local Git metadata.
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SobStage-release-candidate
          path: release-assets

      - name: Reconfirm the candidate is still the tip of main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)"
          if [[ "$main_sha" != "$CANDIDATE_SHA" ]]; then
            echo "::error::main moved to $main_sha while this candidate was building; rerun the release from the new tip instead of publishing $CANDIDATE_SHA."
            exit 1
          fi

      - name: Verify the promoted release candidate
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS

      # The written notes for this version, from the exact candidate commit.
      # Only that folder is checked out; everything else stays untouched.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: notes-src
          sparse-checkout: docs/release-notes
          persist-credentials: false

      - name: Require release notes for this version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          notes="notes-src/docs/release-notes/${RELEASE_TAG}.md"
          if [[ ! -s "$notes" ]]; then
            echo "::error::Missing $notes. Write the release notes for ${RELEASE_TAG} before publishing it."
            exit 1
          fi

      - name: Refuse to replace an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. SobStage release assets are immutable; publish a new version instead."
            exit 1
          fi

      # On a dispatch, the action creates the already-validated version tag at
      # the exact commit whose already-packaged artifacts passed every check.
      - name: Create a draft release and upload every asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/*.zip
            release-assets/*.dmg
            release-assets/SHA256SUMS
          body_path: notes-src/docs/release-notes/${{ needs.prepare.outputs.release_tag }}.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          draft: true

      # A failed upload leaves a private draft instead of a half-published
      # release. Only after every remote asset downloads and its checksums pass
      # does the workflow make the release public.
      - name: Verify the draft from GitHub, then publish it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          downloaded="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$downloaded"
          (cd "$downloaded" && sha256sum --check SHA256SUMS)
          gh release edit "$RELEASE_TAG" --draft=false --verify-tag
