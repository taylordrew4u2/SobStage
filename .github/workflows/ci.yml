name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Source/Core has no JUCE dependency and no audio hardware requirement,
      # so it builds and its tests run on every target OS without a fetch.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # Linux only, and the reason this job matters beyond unit tests: it runs
      # the REAL platform backend against ALSA devices the OS enumerates and
      # opens. Nothing else in CI exercises an actual OS audio API.
      - name: Live capture through a real audio API
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev alsa-utils
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DMMA_ALLOW_TEST_INPUTS=ON
          cmake --build build --config Release -j 4
          ./Tools/setup_alsa_fixture.sh
          ./build/live_capture "${RUNNER_TEMP}/live"

      # Threads and raw buffers, so the same runs again under sanitizers: a
      # data race or an overrun in the backends is the class of bug that
      # reaches a user as an intermittent crash rather than a failed check.
      #
      # Everything that can be built here, not just the two backends. This step
      # used to sanitize sim_coreaudio and sim_wasapi alone, which left the 547
      # unit tests and the whole capture path unwatched -- including
      # DetachedRefreshCache, which exists to own detached threads. Adding
      # sim_capture_mac found 150 data races on its first run.
      #
      # live_capture is here because it is the ONLY target that runs
      # AlsaBackend. The sentence above says "everything that can be built
      # here" and this could be, and was not: the one backend driven against a
      # real OS audio API was the one backend no sanitiser ever watched, while
      # the two simulated ones were watched twice over. It owns a worker
      # thread, a condition variable and a thread it deliberately detaches when
      # a device will not finish opening, which is precisely the shape of code
      # the previous paragraph is about.
      #
      # MMA_ALLOW_TEST_INPUTS is needed because live_capture drives the virtual
      # devices from setup_alsa_fixture.sh, and the input policy refuses those
      # without it -- the release build above already sets it. Verified not to
      # change anything else in this step: the 547 unit tests and all three
      # simulated backends pass with it on.
      #
      # sim_capture_win joins them because it is the most thread-heavy target
      # in the tree -- a render worker, a capture worker and the coordinator all
      # running at once -- and it was the one simulated backend no sanitiser
      # watched. It was added after the list was written and the list was not
      # updated, which is the same omission the paragraph above describes. The
      # gap was not theoretical: a use-after-free in the fake audio service,
      # where a removed endpoint was deleted while the render worker still held
      # it, was found in exactly this target with exactly this sanitiser.
      #
      # alsa_monitor_loss is here for the other half of AlsaBackend.
      # live_capture opens inputs only -- it passes no output device to
      # startMonitoring -- so the PLAYBACK worker, snd_pcm_writei and the
      # output branch of the worker loop, was watched by nothing. This target
      # is the only one that opens an ALSA output stream at all.
      #
      # It runs TWICE: once healthy, and once with the shim killing the output
      # mid-take. Run bare it only takes the control path, because the failure
      # scenario needs LD_PRELOAD -- so the -ENODEV branch, where the worker
      # gives up and reports while the take carries on, would have stayed
      # outside the sanitizers while the easy path sat inside them.
      #
      # The sanitizer runtime is preloaded ahead of the shim because it has to
      # come first in the library list; it says so itself, and without it the
      # process aborts before main. That is the whole of the difficulty, and
      # it was assumed to be worse than it is until it was tried.
      - name: Simulated backends under sanitizers
        if: runner.os == 'Linux'
        run: |
          # -fno-sanitize-recover so a UBSan diagnostic aborts the run:
          # without it the sanitizer prints the error and the binary still
          # exits 0, which is how undefined behaviour rides through a green CI.
          SANITIZED="sim_coreaudio sim_wasapi sim_capture_mac sim_capture_win sim_mix_bus mma_core_tests live_capture alsa_monitor_loss alsa_rate_refusal alsa_readi_shim"

          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DMMA_ALLOW_TEST_INPUTS=ON \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake --build build-asan --target ${SANITIZED} -j 4
          ./build-asan/sim_coreaudio
          ./build-asan/sim_wasapi
          ./build-asan/sim_capture_mac
          ./build-asan/sim_capture_win
          ./build-asan/sim_mix_bus
          ./build-asan/Tests/mma_core_tests
          ./build-asan/live_capture "${RUNNER_TEMP}/live-asan"
          ./build-asan/alsa_monitor_loss
          MMA_SHIM_MODE=dead MMA_SHIM_STREAM=playback MMA_SHIM_DEVICE=mma_out \
          MMA_SHIM_FAIL_AFTER_MS=2000 \
          LD_PRELOAD="$(gcc -print-file-name=libasan.so):${PWD}/build-asan/libalsa_readi_shim.so" \
            ./build-asan/alsa_monitor_loss
          MMA_SHIM_OPEN_MATCH=plughw:99 MMA_SHIM_OPEN_AS=mma_out MMA_SHIM_REFUSE_RATE=48000 \
          LD_PRELOAD="$(gcc -print-file-name=libasan.so):${PWD}/build-asan/libalsa_readi_shim.so" \
            ./build-asan/alsa_rate_refusal 48000 44100

          cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DMMA_ALLOW_TEST_INPUTS=ON -DCMAKE_CXX_FLAGS="-fsanitize=thread"
          cmake --build build-tsan --target ${SANITIZED} -j 4
          ./build-tsan/sim_coreaudio
          ./build-tsan/sim_wasapi
          ./build-tsan/sim_capture_mac
          ./build-tsan/sim_capture_win
          ./build-tsan/sim_mix_bus
          ./build-tsan/Tests/mma_core_tests
          ./build-tsan/live_capture "${RUNNER_TEMP}/live-tsan"
          ./build-tsan/alsa_monitor_loss
          MMA_SHIM_MODE=dead MMA_SHIM_STREAM=playback MMA_SHIM_DEVICE=mma_out \
          MMA_SHIM_FAIL_AFTER_MS=2000 \
          LD_PRELOAD="$(gcc -print-file-name=libtsan.so):${PWD}/build-tsan/libalsa_readi_shim.so" \
            ./build-tsan/alsa_monitor_loss
          MMA_SHIM_OPEN_MATCH=plughw:99 MMA_SHIM_OPEN_AS=mma_out MMA_SHIM_REFUSE_RATE=48000 \
          LD_PRELOAD="$(gcc -print-file-name=libtsan.so):${PWD}/build-tsan/libalsa_readi_shim.so" \
            ./build-tsan/alsa_rate_refusal 48000 44100

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 rather than macos-latest: JUCE 7.0.12 calls
        # CGWindowListCreateImage, which the macOS 15+ SDK marks unavailable, so
        # JUCE's own juceaide fails to build there. macOS 14's SDK still has it,
        # and §1 puts the deployment floor at macOS 13. Moving to a newer SDK
        # means moving to JUCE 8.
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # CoreAudioBackend and WasapiAsioBackend sit behind JUCE_MAC / JUCE_WINDOWS
      # guards, so only the matching runner compiles them at all. Without this job
      # they are never built anywhere.
      - name: Install Linux JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            xvfb xdotool imagemagick

      - name: Cache JUCE
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-app/_deps
          # Keep CI's native-architecture generated JUCE build state away
          # from Release's universal macOS tree. GitHub cache keys are shared
          # across workflows and immutable once written.
          # The repository's name is in the key because the cached tree records
          # the absolute path it was configured in (/work/<repo>/<repo>/...):
          # after the rename from usbmic, the old cache made CMake refuse to
          # configure.
          key: ci-app-juce-4f43011b96eb0636104cb3e433894cda98243626-${{ hashFiles('ThirdParty/Patches/juce-7.0.12-camera-lifecycle.patch') }}-${{ github.event.repository.name }}-${{ runner.os }}-${{ runner.arch }}

      - name: Configure
        run: cmake -B build-app -DMMA_BUILD_APP=ON -DMMA_ALLOW_TEST_INPUTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-app --config Release -j 4

      # These targets depend on the JUCE app configuration and therefore do
      # not exist in the headless Core job above. Execute them here instead of
      # treating a successful compile as proof that camera hot-plug and the
      # keyboard/layout regressions still behave correctly.
      # The app layer was built on every push and executed on none of it.
      # Application.cpp is five thousand lines, nothing links it but the
      # SobStage binary, and the only thing that ever ran it end to end was
      # this gate -- which lived in release.yml, so the real recording path
      # was proven when someone cut a release and at no other time.
      #
      # It drives the actual application: Xvfb, a real window, a real click on
      # record, the real ALSA backend reading the fixture's virtual
      # microphones, and verify_take.py opening the files that come out. Three
      # or four minutes to know that pressing record still writes a playable
      # take.
      - name: The app records a real take
        if: runner.os == 'Linux'
        run: |
          ./Tools/setup_alsa_fixture.sh
          bash Tools/e2e_app_take.sh 8
          bash Tools/e2e_refusal.sh
          bash Tools/e2e_stuck_device.sh
          bash Tools/e2e_headless.sh
          bash Tools/e2e_two_takes.sh 6
          bash Tools/e2e_bus_power.sh
          bash Tools/alsa_recovery_death.sh
          bash Tools/alsa_mid_take_loss.sh
          bash Tools/alsa_monitor_loss.sh
          bash Tools/alsa_rate_refusal.sh
          bash Tools/alsa_busy_probe.sh
          bash Tools/e2e_disk_full.sh
          bash Tools/e2e_card_stall.sh
          bash Tools/e2e_realtime_mics.sh 75
          bash Tools/e2e_ui_walk.sh

      - name: App-integrated regression tests
        run: >-
          ctest --test-dir build-app --build-config Release
          --tests-regex "^(layout_probe|sim_channel_meter|sim_camera|sim_camera_sync_lifecycle|sim_take_combiner|mac_movie_combiner_check)$" --no-tests=error
          --output-on-failure
